function renderProducts(){
  const allProds=productData();
  const q=(searchQuery||'').trim().toLowerCase();
  const isFiltered=(selectedCategory!=='all')||Boolean(q);
  const rows=allProds.filter(p=>{
    const matchCat=selectedCategory==='all'||p.category===selectedCategory;
    if(!matchCat)return false;
    if(!q)return true;
    const matchName=(p.name||'').toLowerCase().includes(q);
    const matchSub=(p.sub||'').toLowerCase().includes(q);
    const matchDesc=(p.desc||'').toLowerCase().includes(q);
    const matchPacks=(p.packs||'').toLowerCase().includes(q);
    const matchTags=(p.tags||[]).some(tag=>tag.toLowerCase().includes(q));
    return matchName||matchSub||matchDesc||matchPacks||matchTags;
  });

  const countEl=$('#product-count-badge');
  if(countEl){
    if(q){
      countEl.innerHTML=`${t('Found','मिले','تم العثور على')} <strong>${rows.length}</strong> ${t('of','में से','من')} ${allProds.length} ${t('products','उत्पाद','منتج')}`;
    }else if(selectedCategory!=='all'){
      countEl.innerHTML=`${t('Showing','दिखा रहे हैं','عرض')} <strong>${rows.length}</strong> ${t('of','में से','من')} ${allProds.length} ${t('products','उत्पाद','منتج')}`;
    }else if(!productsExpanded){
      countEl.innerHTML=`${t('Curated Selection:','विशेष चयन:','مختارات مميزة:')} <strong>6</strong> ${t('of','में से','من')} ${allProds.length} ${t('Products','उत्पाद','منتج')}`;
    }else{
      countEl.innerHTML=`${t('All','सभी','جميع')} <strong>${allProds.length}</strong> ${t('Premium Products','प्रीमियम उत्पाद','منتجات فاخرة')}`;
    }
  }

  const clearBtn=$('#product-search-clear');
  if(clearBtn){
    if(q){clearBtn.removeAttribute('hidden');}
    else{clearBtn.setAttribute('hidden','');}
  }

  const expandContainer=$('#product-expand-container');
  if(expandContainer){
    if(!isFiltered){
      if(!productsExpanded){
        expandContainer.innerHTML=`
          <div class="product-expand-bar">
            <button type="button" class="btn-expand-products" id="btn-toggle-products" aria-expanded="false">
              <span class="expand-icon" aria-hidden="true">↓</span>
              <span><strong>${t('View All 28 Products','सभी 28 उत्पाद देखें','عرض جميع المنتجات (28)')}</strong> <span class="expand-sub">(${t('Show 22 more products ↓','22 और उत्पाद देखें ↓','عرض 22 منتجاً إضافياً ↓')})</span></span>
            </button>
          </div>`;
      }else{
        expandContainer.innerHTML=`
          <div class="product-expand-bar">
            <button type="button" class="btn-expand-products is-expanded" id="btn-toggle-products" aria-expanded="true">
              <span class="expand-icon" aria-hidden="true">↑</span>
              <span><strong>${t('Show Less Products','कम उत्पाद दिखाएं','عرض أقل')}</strong> <span class="expand-sub">(${t('Curated view ↑','क्यूरेटेड दृश्य ↑','عرض مصغر ↑')})</span></span>
            </button>
          </div>`;
      }
      const toggleBtn=$('#btn-toggle-products');
      if(toggleBtn){
        toggleBtn.onclick=()=>{
          productsExpanded=!productsExpanded;
          renderProducts();
          if(!productsExpanded){
            const prodSec=$('#products');
            if(prodSec){prodSec.scrollIntoView({behavior:'smooth',block:'start'});}
          }
        };
      }
    }else{
      expandContainer.innerHTML='';
    }
  }

  if(rows.length===0){
    $('#product-grid').innerHTML=`
      <div class="product-empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🔍</div>
        <h3>${t('No matching products found','कोई उत्पाद नहीं मिला','لم يتم العثور على منتجات')}</h3>
        <p>${t('We could not find products matching "'+escapeHTML(q)+'". Try a different keyword or reset filters.','हमें "'+escapeHTML(q)+'" से मेल खाता कोई उत्पाद नहीं मिला। कृपया दूसरा शब्द खोजें या फ़िल्टर हटाएं।','لم نتمكن من العثور على نتائج لـ "'+escapeHTML(q)+'". جرب كلمة بحث أخرى.')}</p>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap">
          <button type="button" class="btn" id="product-reset-search">${t('Clear Search & Filters','फ़िल्टर और खोज हटाएं','إعادة ضبط البحث')}</button>
          <a href="#partners" data-role="Distributor" class="btn outline">${t('Enquire for Custom Supply','कस्टम आपूर्ति पूछताछ','استفسار عن توريد خاص')}</a>
        </div>
      </div>
    `;
    const resetBtn=$('#product-reset-search');
    if(resetBtn){
      resetBtn.onclick=()=>{
        searchQuery='';
        selectedCategory='all';
        const searchInput=$('#product-search-input');
        if(searchInput)searchInput.value='';
        document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter==='all'));
        renderProducts();
      };
    }
    return;
  }

  const displayRows=(!isFiltered && !productsExpanded)?rows.slice(0,6):rows;

  $('#product-grid').innerHTML=displayRows.map(p=>{
    const origIdx=allProds.indexOf(p);
    const catObj=categories().find(c=>c[0]===p.category);
    const catLabel=catObj?catObj[1]:p.category;
    const mediaHtml=p.img?`
      <div class="product-media" data-product-idx="${origIdx}" title="${t('Quick View: ','त्वरित दृश्य: ','معاينة سريعة: ')}${escapeHTML(p.name)}">
        ${p.badge?`<span class="product-badge-overlay">✦ ${p.badge}</span>`:''}
        <img src="${encodeURI(p.img)}" alt="${escapeHTML(p.name)}" loading="lazy">
        <button type="button" class="product-quick-btn" data-product-idx="${origIdx}" aria-label="${t('Quick View Modal','त्वरित दृश्य','معاينة سريعة')}">⚡ ${t('Quick View','क्विक व्यू','معاينة')}</button>
      </div>`:`
      <div class="product-media" data-product-idx="${origIdx}" style="background:linear-gradient(135deg,#092840,#123f62);display:flex;align-items:center;justify-content:center;color:#dfbf83;font-size:2.2rem">
        ${p.badge?`<span class="product-badge-overlay">✦ ${p.badge}</span>`:''}
        <span>🌾</span>
        <button type="button" class="product-quick-btn" data-product-idx="${origIdx}" aria-label="${t('Quick View Modal','त्वरित दृश्य','معاينة سريعة')}">⚡ ${t('Quick View','क्विक व्यू','معاينة')}</button>
      </div>`;
    const specsHtml=(p.tags&&p.tags.length)?`
      <div class="product-specs">
        ${p.tags.slice(0,2).map(tag=>`<span>${tag}</span>`).join('')}
      </div>`:'';
    const packsHtml=p.packs?`
      <div class="product-packs">
        <span>📦 <strong>${t('Packs','पैक','العبوات')}:</strong> ${p.packs}</span>
      </div>`:'';
    return `
      <article class="card product">
        ${mediaHtml}
        <div class="product-body">
          <div class="product-top">
            <span class="product-cat">${catLabel}</span>
            ${p.halal?`<span class="product-halal">✓ ${t('Halal Certified','हलाल प्रमाणित','حलाल معتمد')}</span>`:''}
          </div>

          <p class="product-desc">${p.desc}</p>
          ${specsHtml}
          ${packsHtml}
          <div class="product-actions">
            <button type="button" class="btn outline product-quick-action" data-product-idx="${origIdx}" title="${t('Quick Preview','त्वरित पूर्वावलोकन','معاينة سريعة')}">⚡ ${t('Quick View','क्विक व्यू','معاينة')}</button>
            <a class="btn" href="${p.page}">${t('Specs →','विवरण →','المواصفات ←')}</a>
            <a class="btn outline" href="#partners" data-role="Distributor" data-product="${escapeHTML(p.name)}" title="${t('Direct Enquiry','सीधी पूछताछ','استفسار مباشر')}">✉</a>
          </div>
        </div>
      </article>
    `;
  }).join('');
  initScrollReveal();
}

      ${p.packs?`<div class="product-packs" style="margin:16px 0;padding:10px 14px;font-size:.84rem">📦 <strong>${t('Pack Sizes & Packaging Formats:','उपलब्ध पैक एवं पैकेजिंग प्रारूप:','أحجام العبوات وأنواع التغليف:')}</strong> ${p.packs}</div>`:''}

      <div class="highlight-item"><strong>${t('Direct Rural Source','सीधा ग्रामीण स्रोत','مصدر قروي مباشر')}</strong><span>${t('Farmer-integrated transparent supply chain','किसानों से जुड़ी पारदर्शी आपूर्ति श्रृंखला','سلسلة إمداد شفافة مرتبطة بالمزارعين')}</span></div>

let _revealObserver=null;
function initScrollReveal(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('.reveal, .reveal-stagger, .product').forEach(el=>el.classList.add('is-visible'));
    return;
  }
  if('IntersectionObserver' in window){
    if(!_revealObserver){
      _revealObserver=new IntersectionObserver((entries,obs)=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          }
        });
      },{rootMargin:'0px 0px 80px 0px',threshold:0});
    }
    document.querySelectorAll('.reveal:not(.is-visible), .reveal-stagger:not(.is-visible), .card.product:not(.is-visible)').forEach(el=>{
      _revealObserver.observe(el);
    });
  }else{
    document.querySelectorAll('.reveal, .reveal-stagger, .product').forEach(el=>el.classList.add('is-visible'));
  }
}

        h.classList.remove('scrolled');

    if(bar){
      const winScroll=document.documentElement.scrollTop||document.body.scrollTop;
      const height=document.documentElement.scrollHeight-document.documentElement.clientHeight;
      const scrolled=(height>0)?(winScroll/height)*100:0;
      bar.style.width=scrolled+'%';
    }
    const btt=document.getElementById('backToTop');
    if(btt){
      if(window.scrollY>450){
        btt.classList.add('show');
      }else{
        btt.classList.remove('show');
      }
    }
  },{passive:true});
}

/* ── Inline field validation on blur ── */
$('#enquiry-form').addEventListener('blur',e=>{
  const el=e.target;
  if(!el.name||el.type==='checkbox')return;
  const label=el.closest('label')||el.closest('.field');
  let msg=label&&label.querySelector('.field-error-msg');
  if(!el.validity.valid){
    el.classList.add('field-error');
    if(!msg){msg=document.createElement('span');msg.className='field-error-msg';el.after(msg);}
    msg.textContent=el.validationMessage;
  }else{
    el.classList.remove('field-error');
    if(msg)msg.remove();
  }
},true);

$('#enquiry-form').addEventListener('submit',e=>{
  e.preventDefault();
  const form=e.currentTarget;
  if(!form.reportValidity())return;
  const btns=[...form.querySelectorAll('button[type=submit]')];
  const origTexts=btns.map(b=>b.textContent);
  btns.forEach(b=>{b.setAttribute('aria-busy','true');b.textContent=t('Opening…','खुल रहा है…','جارٍ الفتح…');});
  const f=new FormData(form);
  const body=`Hello Kotwari,\n\nPartnership: ${f.get('role')}\nName: ${f.get('name')}\nMobile: ${f.get('phone')}\nState / Region: ${f.get('state')}\nDistrict / City: ${f.get('district')}\nDetails: ${f.get('context')}\n\nEnquiry: ${f.get('message')}`;
  const isEmail=e.submitter?.value==='email';
  const url=isEmail?'mailto:'+CONFIG.email+'?subject='+encodeURIComponent('Kotwari enquiry - '+f.get('role'))+'&body='+encodeURIComponent(body):'https://wa.me/'+CONFIG.phone+'?text='+encodeURIComponent(body);
  if(isEmail){window.location.href=url;}else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';document.body.append(a);a.click();a.remove();}
  setTimeout(()=>{btns.forEach((b,i)=>{b.removeAttribute('aria-busy');b.textContent=origTexts[i];});},2500);
  const st=$('#form-status');
  st.className='form-success';
  st.innerHTML=t(
    'Your draft has been opened in WhatsApp or your email app. <strong>Please review and press Send there — nothing has been submitted here.</strong> <a href="thank-you.html">Back to confirmation page ↗</a>',
    'आपका ड्राफ्ट WhatsApp या ईमेल ऐप में खुल गया है। <strong>वहां जांच कर Send दबाएं — यहां कुछ जमा नहीं हुआ है।</strong> <a href="thank-you.html">पुष्टि पेज पर जाएं ↗</a>',
    'تم فتح مسودتك في واتساب أو البريد. <strong>يرجى المراجعة والضغط على إرسال هناك — لم يُقدَّم أي طلب هنا.</strong> <a href="thank-you.html">صفحة التأكيد ↗</a>'
  );
});

/* ── Hero Audio Experience Controller (Strictly Manual on User Click) ── */
(function initHeroAudio(){
  const btn=$('#heroAudioToggle');
  const label=$('#audioLabel');
  const audioSrc=CONFIG.audio||'music.mp3';
  const TARGET_VOLUME=0.15;

  if(!window._kotwariAudio){
    const a=new Audio(audioSrc);
    a.loop=false;
    a.volume=TARGET_VOLUME;
    a.preload='none';
    window._kotwariAudio=a;
    window._kotwariAudioPlaying=false;
  }
  const audio=window._kotwariAudio;
  audio.loop=false;

  // Ensure audio is stopped on page load
  if(!audio.paused){
    audio.pause();
  }

  function updateUI(playing){
    window._kotwariAudioPlaying=playing;
    if(btn)btn.setAttribute('aria-pressed',playing?'true':'false');
    if(label){
      label.textContent=playing?t('Pause Audio','ऑडियो रोकें','إيقاف الصوت'):t('Audio Story','ऑडियो सुनें','تجربة صوتية');
    }
  }

  function rampVolume(targetVol,durationMs){
    audio.volume=0.02;
    const stepTime=50;
    const steps=Math.max(1,durationMs/stepTime);
    const volIncrement=(targetVol-0.02)/steps;
    let currentStep=0;
    const timer=setInterval(()=>{
      currentStep++;
      if(currentStep>=steps){
        audio.volume=targetVol;
        clearInterval(timer);
      } else {
        audio.volume=Math.min(targetVol,audio.volume+volIncrement);
      }
    },stepTime);
  }

  function playTrack(){
    if(audio.ended){
      audio.currentTime=0;
    }
    audio.volume=0.02;
    const playPromise=audio.play();
    if(playPromise!==undefined){
      playPromise.then(()=>{
        rampVolume(TARGET_VOLUME,1200);
        updateUI(true);
      }).catch(()=>{
        updateUI(false);
      });
    }
  }

  function pauseTrack(){
    audio.pause();
    updateUI(false);
  }

  if(btn){
    btn.onclick=()=>{
      if(window._kotwariAudioPlaying){
        pauseTrack();
      } else {
        playTrack();
      }
    };
  }

  if(!window._kotwariAudioListenersBound){
    window._kotwariAudioListenersBound=true;
    audio.addEventListener('ended',()=>{
      window._kotwariAudioPlaying=false;
      updateUI(false);
    });
    audio.addEventListener('pause',()=>updateUI(false));
    audio.addEventListener('play',()=>updateUI(true));
  }
  updateUI(false);
}());
}
