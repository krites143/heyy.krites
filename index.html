/* Cookie consent banner */
.cookie-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#0d2f47;color:#d4e2ea;font-size:.84rem;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-top:2px solid var(--gold)}.cookie-bar p{margin:0;flex:1 1 280px}.cookie-bar .cookie-accept{background:var(--gold);color:#092840;border:none;border-radius:4px;padding:9px 20px;font-weight:bold;cursor:pointer;white-space:nowrap}.cookie-bar .cookie-decline{background:transparent;color:#d4e2ea;border:1px solid #466073;border-radius:4px;padding:9px 16px;cursor:pointer;white-space:nowrap}.cookie-bar[hidden]{display:none!important}
/* Form field error state */
.field-error{border-color:#c0392b!important;box-shadow:0 0 0 2px #c0392b22!important}.field-error-msg{color:#c0392b;font-size:.8rem;margin-top:3px;display:block}
/* Form success banner */
.form-success{background:#edfaf4;border:1px solid #2ecc71;border-left:4px solid #27ae60;border-radius:6px;padding:16px 20px;color:#1a5c38;margin-top:16px;font-size:.9rem}.form-success a{color:#1a5c38;text-decoration:underline}
/* Button loading state */
.btn[aria-busy=true]{opacity:.7;pointer-events:none;cursor:default}
/* Hero Audio Controller & Tags */
.hero-audio-btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:10px 20px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(223,191,131,.5);border-radius:40px;color:#f6f0e2;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .25s}
.hero-audio-btn:hover{background:rgba(255,255,255,.2);border-color:var(--gold);color:white;transform:translateY(-2px)}
.hero-audio-btn[aria-pressed="true"]{background:rgba(188,148,79,.3);border-color:var(--gold);color:#ffd88d;box-shadow:0 0 20px rgba(188,148,79,.25)}
.audio-eq{display:inline-flex;align-items:center;gap:2.5px;height:16px}
.audio-eq span{display:inline-block;width:3px;height:14px;background:var(--gold);border-radius:2px;transform-origin:bottom;transition:transform .2s}
.hero-audio-btn[aria-pressed="true"] .audio-eq span:nth-child(1){animation:eq .8s ease-in-out infinite alternate}
.hero-audio-btn[aria-pressed="true"] .audio-eq span:nth-child(2){animation:eq .6s ease-in-out .2s infinite alternate}
.hero-audio-btn[aria-pressed="true"] .audio-eq span:nth-child(3){animation:eq .9s ease-in-out .4s infinite alternate}
.hero-audio-btn[aria-pressed="true"] .audio-eq span:nth-child(4){animation:eq .7s ease-in-out .1s infinite alternate}
@keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.hero-tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.hero-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;font-size:.8rem;color:#dfbf83;letter-spacing:.02em}
.audio-toast{position:absolute;bottom:24px;left:24px;right:24px;max-width:580px;background:rgba(6,32,52,.96);border:1px solid var(--gold);color:#e4d7bd;padding:12px 18px;border-radius:8px;font-size:.84rem;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:15;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s,transform .3s}
.audio-toast.show{opacity:1;transform:translateY(0);pointer-events:auto}
.audio-toast code{background:rgba(255,255,255,.15);padding:2px 6px;border-radius:4px;color:#fff;font-family:monospace}
/* Hero Cinematic Logo Flash & Animations */
.hero-flash-screen{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 900px 600px at 30% 40%,rgba(255,238,185,.42) 0%,rgba(188,148,79,.18) 35%,transparent 70%);animation:screenFlash 1.6s cubic-bezier(.16,1,.3,1) both}
.hero-beam{position:absolute;top:18%;left:-100%;width:70%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,235,175,.9),#ffffff,rgba(223,191,131,.9),transparent);filter:drop-shadow(0 0 10px rgba(223,191,131,.8));transform:rotate(-15deg);pointer-events:none;z-index:2;animation:beamSweep 2.2s cubic-bezier(.16,1,.3,1) both}
@keyframes screenFlash{0%{opacity:0;transform:scale(.92)}25%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.2)}}
@keyframes beamSweep{0%{left:-100%;opacity:0}20%{opacity:1}100%{left:140%;opacity:0}}

.hero-emblem-badge{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-bottom:26px;padding:14px 26px;border-radius:32px;background:radial-gradient(circle at 50% 30%,rgba(24,54,77,.75),rgba(9,40,64,.88));border:1.5px solid rgba(223,191,131,.55);box-shadow:0 18px 45px rgba(0,0,0,.5),0 0 35px rgba(188,148,79,.25),inset 0 1px 2px rgba(255,255,255,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:badgeEntrance 1.6s cubic-bezier(.16,1,.3,1) both}
.hero-emblem-img{width:clamp(170px,26vw,265px);height:auto;display:block;filter:drop-shadow(0 0 22px rgba(223,191,131,.65)) drop-shadow(0 8px 18px rgba(0,0,0,.55));animation:logoEntrance 1.8s cubic-bezier(.16,1,.3,1) both,logoFloat 4.5s ease-in-out infinite alternate 1.8s}
.hero-halo{position:absolute;inset:-50px;background:radial-gradient(circle,rgba(255,238,185,.6) 0%,rgba(188,148,79,.25) 45%,transparent 70%);border-radius:50%;pointer-events:none;animation:haloBurst 2.2s cubic-bezier(.16,1,.3,1) both}
.hero-light-ray{position:absolute;inset:0;overflow:hidden;border-radius:32px;pointer-events:none}
.hero-light-ray:after{content:"";position:absolute;top:-60%;left:-120%;width:65%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),rgba(255,230,165,.95),transparent);transform:rotate(26deg);animation:diagonalSweep 3.2s ease-in-out 0.8s infinite alternate}

@keyframes badgeEntrance{0%{opacity:0;transform:scale(.78) translateY(22px)}60%{opacity:1;transform:scale(1.02) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes logoEntrance{0%{opacity:0;filter:brightness(3) drop-shadow(0 0 60px #fff)}40%{filter:brightness(1.6) drop-shadow(0 0 40px var(--gold))}100%{opacity:1;filter:drop-shadow(0 0 22px rgba(223,191,131,.65)) drop-shadow(0 8px 18px rgba(0,0,0,.55))}}
@keyframes logoFloat{0%{transform:translateY(0)}100%{transform:translateY(-5px)}}
@keyframes haloBurst{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.65)}}

/* Staggered text reveals in hero & metallic gold shimmer */
.hero .eyebrow{animation:heroFadeIn .9s cubic-bezier(.16,1,.3,1) .2s both}
.hero h1{animation:heroFadeIn 1s cubic-bezier(.16,1,.3,1) .4s both}
.hero h1 em{background:linear-gradient(110deg,#dfbf83 0%,#ffffff 45%,#dfbf83 75%,#9d7736 100%);background-size:220% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:goldShimmer 4s ease-in-out infinite}
@keyframes goldShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero .lead{animation:heroFadeIn 1s cubic-bezier(.16,1,.3,1) .6s both}
.hero p:not(.lead):not(.eyebrow){animation:heroFadeIn 1s cubic-bezier(.16,1,.3,1) .8s both}
.hero .actions{animation:heroFadeIn 1s cubic-bezier(.16,1,.3,1) 1s both}
.hero-tags{animation:heroFadeIn 1s cubic-bezier(.16,1,.3,1) 1.2s both}
.hero-route{animation:heroFadeIn 1s cubic-bezier(.16,1,.3,1) 1.4s both}
@keyframes heroFadeIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}

/* Floating Autoplay Audio Prompt */
.audio-autoplay-bar{position:fixed;bottom:85px;right:22px;z-index:35;animation:slideInUp .6s cubic-bezier(.16,1,.3,1) both}
.audio-autoplay-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;background:rgba(9,40,64,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid var(--gold);border-radius:30px;color:#e8c987;font-weight:600;font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.4);cursor:pointer;transition:transform .2s,background .2s}
.audio-autoplay-pill:hover{transform:scale(1.05);background:#123f62;color:white}
.pulse-icon{display:inline-block;animation:pulseScale 1.4s infinite alternate}
@keyframes pulseScale{0%{transform:scale(1)}100%{transform:scale(1.3)}}
@keyframes slideInUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}

/* Product Showcase Grid & Cards */
.product{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s cubic-bezier(.16,1,.3,1),border-color .2s;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(9,40,64,.04)}
.product:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(9,40,64,.12);border-color:var(--gold)}
.product-media{position:relative;width:100%;height:310px;background:#eef3f6;overflow:hidden;cursor:pointer}
.product-media img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.product:hover .product-media img{transform:scale(1.06)}
.product-badge-overlay{position:absolute;top:14px;left:14px;background:rgba(9,40,64,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#e8c987;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:6px 14px;border-radius:20px;border:1px solid rgba(223,191,131,.5);box-shadow:0 4px 15px rgba(0,0,0,.3);z-index:2;display:inline-flex;align-items:center;gap:6px}
.product-zoom-hint{position:absolute;bottom:12px;right:12px;background:rgba(9,40,64,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:.75rem;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2);opacity:0;transform:translateY(4px);transition:all .25s ease}
.product-media:hover .product-zoom-hint{opacity:1;transform:translateY(0)}
.product-body{padding:24px;display:flex;flex-direction:column;flex:1}
.product-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.product-cat{font-size:.74rem;font-weight:bold;letter-spacing:.14em;text-transform:uppercase;color:#8b682b}
.product-halal{font-size:.72rem;background:#edfaf4;color:#1e7e34;font-weight:bold;padding:3px 10px;border-radius:12px;border:1px solid #b7e4c7;display:inline-flex;align-items:center;gap:4px}
.product h3{font:1.42rem Georgia,serif;color:var(--navy);margin:0 0 4px;line-height:1.25}
.product-sub{font-size:.88rem;color:#708090;margin-bottom:12px;font-style:italic;font-weight:500}
.product-desc{font-size:.87rem;color:#495d6d;line-height:1.6;margin-bottom:16px;flex:1}
.product-specs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.product-specs span{font-size:.74rem;padding:4px 10px;border-radius:20px;background:#faf8f1;border:1px solid #dedfd9;color:#596977;font-weight:500}
.product-packs{font-size:.78rem;color:#7a602e;background:#fcf8ee;padding:9px 13px;border-radius:8px;border:1px solid #f2e3be;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.product-actions{display:flex;gap:10px;margin-top:auto}
.product-actions .btn{flex:1;min-height:42px;padding:9px 14px;font-size:.84rem}
.product-actions .btn.outline{flex:0 0 auto;padding:9px 14px}
/* Product Modal Preview Dialog */
.product-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
@media(max-width:768px){.product-modal-grid{grid-template-columns:1fr}}
.product-modal-img{width:100%;max-height:480px;border-radius:12px;border:1px solid var(--line);box-shadow:0 8px 25px rgba(0,0,0,.08);background:#f4f6f8;object-fit:contain}

<section id="exports" class="band"><div class="wrap split"><div><p class="eyebrow">Kotwari Global</p><h2>${t('From Indian villages<br>to global markets.','भारत के गांवों से<br>वैश्विक बाजार तक।','من قرى الهند<br>إلى الأسواق العالمية.')}</h2><p>${t('Export vision: eggs, rice, spices, dry fruits, packaged foods, water and other approved agricultural products.','निर्यात विज़न: अंडे, चावल, मसाले, ड्राई फ्रूट, पैकेज्ड फूड, पानी और अन्य स्वीकृत कृषि उत्पाद।','رؤية التصدير: البيض والأرز والتوابل والفواكه المجففة والأغذية المعبأة والمياه والمنتجات الزراعية المعتمدة الأخرى.')}</p>${cta('Export',t('Explore export opportunities','निर्यात अवसर जानें','استكشف فرص التصدير'))}</div><div class="card"><p class="eyebrow">${t('Target / expansion markets','लक्षित / विस्तार बाजार','أسواق التوسع المستهدفة')}</p><h3>UAE · Saudi Arabia · GCC</h3><p>${t('Asia · Africa · Other international markets','एशिया · अफ्रीका · अन्य अंतरराष्ट्रीय बाजार','آسيا · أفريقيا · أسواق دولية أخرى')}</p><p class="hint">${t('These are target markets, not a statement of current export operations. Confirmed markets and product eligibility will be shared by the team.','ये लक्षित बाजार हैं, वर्तमान निर्यात संचालन का दावा नहीं। सत्यापित बाजार और उत्पाद पात्रता की जानकारी टीम से लें।','هذه أسواق مستهدفة وليست إعلاناً عن عمليات تصدير حالية. يقدم الفريق معلومات الأسواق المؤكدة وأهلية المنتجات.')}</p><a href="exports.html" style="font-weight:bold;border-bottom:1px solid var(--gold);padding-bottom:4px">${t('See full Kotwari Global page','पूरा Kotwari Global पेज देखें','عرض صفحة كوتواري العالمية')} →</a></div></div></section>

id var(--gold);padding-bottom:4px">${t('See full investor relations page','पूरा निवेशक संबंध पेज देखें','عرض صفحة علاقات المستثمرين')} →</a></div></div></section>

$('#role').addEventListener('change',renderFields);$('.close').addEventListener('click',()=>$('#modal').close());

/* ── Inline field validation on blur ── */
$('#enquiry-form').addEventListener('blur',e=>{
  const el=e.target;
  if(!el.name||el.type==='checkbox')return;
  const label=el.closest('label')||el.closest('.field');
  let msg=label&&label.querySelector('.field-error-msg');
  if(!el.validity.valid){
    el.classList.add('field-error');
    if(!msg){msg=document.createElement('span');msg.className='field-error-msg';el.after(msg);}
    msg.textContent=el.validationMessage;
  }else{
    el.classList.remove('field-error');
    if(msg)msg.remove();
  }
},true);

/* ── Form submit with loading state and success banner ── */
$('#enquiry-form').addEventListener('submit',e=>{
  e.preventDefault();
  const form=e.currentTarget;
  if(!form.reportValidity())return;
  const btns=[...form.querySelectorAll('button[type=submit]')];
  const origTexts=btns.map(b=>b.textContent);
  btns.forEach(b=>{b.setAttribute('aria-busy','true');b.textContent=t('Opening…','खुल रहा है…','جارٍ الفتح…');});
  const f=new FormData(form);
  const body=`Hello Kotwari,\n\nPartnership: ${f.get('role')}\nName: ${f.get('name')}\nMobile: ${f.get('phone')}\nState / Region: ${f.get('state')}\nDistrict / City: ${f.get('district')}\nDetails: ${f.get('context')}\n\nEnquiry: ${f.get('message')}`;
  const isEmail=e.submitter?.value==='email';
  const url=isEmail?'mailto:'+CONFIG.email+'?subject='+encodeURIComponent('Kotwari enquiry - '+f.get('role'))+'&body='+encodeURIComponent(body):'https://wa.me/'+CONFIG.phone+'?text='+encodeURIComponent(body);
  if(isEmail){window.location.href=url;}else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';document.body.append(a);a.click();a.remove();}
  setTimeout(()=>{btns.forEach((b,i)=>{b.removeAttribute('aria-busy');b.textContent=origTexts[i];});},2500);
  const st=$('#form-status');
  st.className='form-success';
  st.innerHTML=t(
    'Your draft has been opened in WhatsApp or your email app. <strong>Please review and press Send there — nothing has been submitted here.</strong> <a href="thank-you.html">Back to confirmation page ↗</a>',
    'आपका ड्राफ्ट WhatsApp या ईमेल ऐप में खुल गया है। <strong>वहां जांच कर Send दबाएं — यहां कुछ जमा नहीं हुआ है।</strong> <a href="thank-you.html">पुष्टि पेज पर जाएं ↗</a>',
    'تم فتح مسودتك في واتساب أو البريد. <strong>يرجى المراجعة والضغط على إرسال هناك — لم يُقدَّم أي طلب هنا.</strong> <a href="thank-you.html">صفحة التأكيد ↗</a>'
  );
});

  if(!stored){bar.removeAttribute('hidden');}
  document.getElementById('cookieAccept').addEventListener('click',()=>{localStorage.setItem('kotwari_cookie_consent','accepted');bar.setAttribute('hidden','');});
  document.getElementById('cookieDecline').addEventListener('click',()=>{localStorage.setItem('kotwari_cookie_consent','declined');bar.setAttribute('hidden','');});
}());

/* ── Hero Audio Experience Controller & Autoplay ── */
(function initHeroAudio(){
  const btn=$('#heroAudioToggle');
  const label=$('#audioLabel');
  const toast=$('#audioToast');
  const autoBar=$('#audioAutoplayBar');
  const autoTrigger=$('#audioAutoplayTrigger');
  const audioSrc=CONFIG.audio||'music.mp3';

  // Low ambient volume (15%) to avoid blasting
  const TARGET_VOLUME=0.15;

  if(!window._kotwariAudio){
    const a=new Audio(audioSrc);
    a.loop=false; // STRICTLY PLAY ONCE
    a.volume=TARGET_VOLUME;
    a.preload='auto';
    window._kotwariAudio=a;
    window._kotwariAudioHasPlayed=false;
  }
  const audio=window._kotwariAudio;
  audio.loop=false;

  function updateUI(playing){
    window._kotwariAudioPlaying=playing;
    if(btn)btn.setAttribute('aria-pressed',playing?'true':'false');
    if(label){
      label.textContent=playing?t('Pause Audio','ऑडियो रोकें','إيقاف الصوت'):t('Audio Story','ऑडियो सुनें','تجربة صوتية');
    }
    if(autoBar){
      if(playing||window._kotwariAudioHasPlayed)autoBar.setAttribute('hidden','');
    }
  }

  // Smooth fade-in so audio starts gently
  function rampVolume(targetVol,durationMs){
    audio.volume=0.02;
    const stepTime=50;
    const steps=Math.max(1,durationMs/stepTime);
    const volIncrement=(targetVol-0.02)/steps;
    let currentStep=0;
    const timer=setInterval(()=>{
      currentStep++;
      if(currentStep>=steps){
        audio.volume=targetVol;
        clearInterval(timer);
      } else {
        audio.volume=Math.min(targetVol,audio.volume+volIncrement);
      }
    },stepTime);
  }

  function cleanListeners(){
    window.removeEventListener('click',onFirstUserTouch);
    window.removeEventListener('touchstart',onFirstUserTouch);
    window.removeEventListener('keydown',onFirstUserTouch);
  }

  function playTrack(isExplicit){
    // If it has already played and completed once, do not auto-play
    if(window._kotwariAudioHasPlayed && !isExplicit && (audio.currentTime>=audio.duration || audio.ended)){
      return;
    }
    if(audio.ended){
      audio.currentTime=0;
    }
    audio.volume=0.02;
    const playPromise=audio.play();
    if(playPromise!==undefined){
      playPromise.then(()=>{
        rampVolume(TARGET_VOLUME,1200);
        updateUI(true);
        cleanListeners();
      }).catch(()=>{
        updateUI(false);
        // Only prompt if audio has never played yet
        if(autoBar && !window._kotwariAudioHasPlayed){
          autoBar.removeAttribute('hidden');
        }
      });
    }
  }

  function pauseTrack(){
    audio.pause();
    updateUI(false);
  }

  function onFirstUserTouch(){
    cleanListeners();
    if(!window._kotwariAudioPlaying && !window._kotwariAudioHasPlayed){
      playTrack(false);
    }
  }

  // Attempt initial playback once on load
  if(!window._kotwariAudioAttempted){
    window._kotwariAudioAttempted=true;
    playTrack(false);

    window.addEventListener('click',onFirstUserTouch,{passive:true});
    window.addEventListener('touchstart',onFirstUserTouch,{passive:true});
    window.addEventListener('keydown',onFirstUserTouch,{passive:true});
  } else {
    updateUI(window._kotwariAudioPlaying||false);
  }

  if(btn){
    btn.onclick=()=>{
      if(window._kotwariAudioPlaying){
        pauseTrack();
      } else {
        playTrack(true);
      }
    };
  }

  if(autoTrigger){
    autoTrigger.onclick=e=>{
      e.stopPropagation();
      playTrack(true);
    };
  }

  audio.addEventListener('ended',()=>{
    window._kotwariAudioHasPlayed=true; // Mark as played once
    window._kotwariAudioPlaying=false;
    updateUI(false);
    cleanListeners();
  });
  audio.addEventListener('pause',()=>updateUI(false));
  audio.addEventListener('play',()=>updateUI(true));
}());
}
render();
</script>
